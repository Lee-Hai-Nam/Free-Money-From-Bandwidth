name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Setup Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Show OS release
        if: runner.os == 'Linux'
        run: cat /etc/os-release

      # For Linux, we'll install the build dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install the needed libraries for Wails application
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          # Install ARM64 cross-compilation tools
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          
      # On Linux, we'll also build for AMD64
      - name: Build App for Linux AMD64
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/amd64 -tags webkit2_41

      # Build ARM64 version with specific configurations to handle cross-compilation issues
      - name: Build App for Linux ARM64
        if: runner.os == 'Linux'
        run: |
          # Since we can't install ARM64 GUI libraries in the repository, we'll skip GUI build for ARM64
          # and instead build a headless version only
          echo "Building headless version for ARM64 only, as GUI libraries are unavailable for cross-compilation"
          CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 CGO_ENABLED=0 CGO_LDFLAGS="-static" go build -o build/bin/free-income-from-bandwidth-linux-arm64-headless ./app.go

      - name: Build App for Windows
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64

      - name: Build App for macOS
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal

      # Build headless versions for Linux
      - name: Build Headless Linux Server (amd64)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o build/bin/free-income-from-bandwidth-headless-linux-amd64 ./app.go

      # ARM64 headless build is handled separately due to cross-compilation constraints
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build/bin/

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/free-income-from-bandwidth*
            build/bin/*free-income-from-bandwidth*
          draft: true
          prerelease: false