name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Setup Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Show OS release
        if: runner.os == 'Linux'
        run: cat /etc/os-release

      # For Linux, we'll install the build dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install the needed libraries for Wails application
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          # Install ARM64 cross-compilation tools
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          
      # On Linux, we'll also build for AMD64
      - name: Build App for Linux AMD64
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/amd64 -tags webkit2_41
          # Rename the output file to include platform details
          mv build/bin/free-income-from-bandwidth build/bin/free-income-from-bandwidth-linux-amd64
          
          # Also build a .deb package for easier installation on Debian-based systems
          mkdir -p package-root/opt/free-income-from-bandwidth
          cp build/bin/free-income-from-bandwidth-linux-amd64 package-root/opt/free-income-from-bandwidth/free-income-from-bandwidth
          mkdir -p package-root/usr/share/applications
          # Create desktop entry file
          echo -e '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Free Income From Bandwidth\nComment=Manage bandwidth sharing apps to earn passive income\nExec=/opt/free-income-from-bandwidth/free-income-from-bandwidth\nIcon=\nCategories=Utility;\nTerminal=false' > package-root/usr/share/applications/free-income-from-bandwidth.desktop
          
          # Create basic control file for the .deb
          mkdir -p package-root/DEBIAN
          echo -e "Package: free-income-from-bandwidth\nVersion: 0.1.0\nSection: utils\nPriority: optional\nArchitecture: amd64\nDepends: libgtk-3-0, libwebkit2gtk-4.1-0\nMaintainer: Bandwidth Income Manager <support@example.com>\nDescription: Manage bandwidth sharing apps to earn passive income\n This application helps manage multiple bandwidth-sharing services." > package-root/DEBIAN/control
          
          # Build the .deb package
          dpkg-deb --build --root-owner-group package-root build/bin/free-income-from-bandwidth-linux-amd64.deb

      # Build ARM64 version - GUI not possible due to unavailable cross-compilation libraries
      # So we only build the headless version for ARM64
      - name: Build Headless App for Linux ARM64
        if: runner.os == 'Linux'
        run: |
          # Since we can't install ARM64 GUI libraries for cross-compilation, we only build the headless version
          echo "Building headless version for ARM64 only, as GUI libraries are unavailable for cross-compilation"
          CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 CGO_ENABLED=0 CGO_LDFLAGS="-static" go build -o build/bin/free-income-from-bandwidth-linux-arm64-headless ./app.go

      - name: Build App for Windows
        if: runner.os == 'Windows'
        run: |
          wails build -platform windows/amd64
          # Rename the output file to include platform details
          move build\bin\free-income-from-bandwidth.exe build\bin\free-income-from-bandwidth-windows-amd64.exe

      - name: Build App for macOS
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal
          # Create a zip file of the .app bundle for macOS
          cd build/bin && zip -r free-income-from-bandwidth-macos-universal.zip free-income-from-bandwidth.app

      # Build headless versions for Linux
      - name: Build Headless Linux Server (amd64)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o build/bin/free-income-from-bandwidth-headless-linux-amd64 ./app.go

      # ARM64 headless build is handled separately due to cross-compilation constraints
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build/bin/

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/free-income-from-bandwidth-*
          draft: true
          prerelease: false