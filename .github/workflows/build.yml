name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Setup Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Show OS release
        if: runner.os == 'Linux'
        run: cat /etc/os-release

      # For Linux, we'll install the build dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install the needed libraries for Wails application
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          # Install ARM64 cross-compilation libraries and ARM64 versions of required packages
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64 libsoup-3.0-dev:arm64
          
      # On Linux, we'll also build for AMD64
      - name: Build App for Linux AMD64
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/amd64 -tags webkit2_41

      # Build ARM64 version with specific configurations to handle cross-compilation issues
      - name: Build App for Linux ARM64
        if: runner.os == 'Linux'
        run: |
          # Set up environment for cross-compilation
          export CC=aarch64-linux-gnu-gcc
          # Ensure pkg-config can find ARM64 libraries
          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig"
          # Verify ARM64 libraries are available
          echo "Available GTK ARM64 pkg-config files:"
          find /usr/lib/aarch64-linux-gnu/pkgconfig -name "*gtk*"
          echo "Available WebKit ARM64 pkg-config files:"
          find /usr/lib/aarch64-linux-gnu/pkgconfig -name "*webkit*"
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc wails build -ldflags="-linkmode external -extldflags -static" -platform linux/arm64 -tags webkit2_41

      - name: Build App for Windows
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64

      - name: Build App for macOS
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal

      # Build headless versions for Linux
      - name: Build Headless Linux Server (amd64)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o build/bin/free-income-from-bandwidth-headless-linux-amd64 ./app.go

      - name: Build Headless Linux Server (arm64)
        if: runner.os == 'Linux'
        run: |
          CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 CGO_ENABLED=0 CGO_LDFLAGS="-static" go build -o build/bin/free-income-from-bandwidth-headless-linux-arm64 ./app.go
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build/bin/

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*
          draft: true
          prerelease: false