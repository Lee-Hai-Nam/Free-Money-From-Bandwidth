name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Setup Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Show OS release
        if: runner.os == 'Linux'
        run: cat /etc/os-release

      # For Linux, we'll install the build dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install the needed libraries for Wails application
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          
      # On Linux, we'll also build for AMD64
      - name: Build App for Linux AMD64
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/amd64 -tags webkit2_41

      # Install ARM64 cross-compilation tools and build ARM64 version
      - name: Install ARM64 cross-compilation tools and build ARM64
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 wails build -ldflags="-linkmode external -extldflags -static" -platform linux/arm64 -tags webkit2_41

      - name: Build App for Windows
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64

      - name: Build App for macOS
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal

      # Build headless versions for Linux
      - name: Build Headless Linux Server (amd64)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o build/bin/free-income-from-bandwidth-headless-linux-amd64 ./app.go

      - name: Build Headless Linux Server (arm64)
        if: runner.os == 'Linux'
        run: |
          CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 CGO_ENABLED=0 CGO_LDFLAGS="-static" go build -o build/bin/free-income-from-bandwidth-headless-linux-arm64 ./app.go
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build/bin/

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*
          draft: true
          prerelease: false