name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Setup Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Show OS release
        if: runner.os == 'Linux'
        run: cat /etc/os-release

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc-aarch64-linux-gnu
      
      - name: Build Windows
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64

      

      - name: Build Linux
        if: runner.os == 'Linux'
        run: CGO_ENABLED=1 GOARCH=arm64 wails build -platform linux/amd64,linux/arm64 -tags webkit2_41 CC=aarch64-linux-gnu-gcc

      - name: Build macOS
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal

      - name: Build Headless Linux Server (amd64)
        if: runner.os == 'Linux'
        run: GOOS=linux GOARCH=amd64 go build -o build/bin/free-money-from-bandwidth-headless-linux-amd64 ./app.go

      - name: Build Headless Linux Server (arm64)
        if: runner.os == 'Linux'
        run: GOOS=linux GOARCH=arm64 go build -o build/bin/free-money-from-bandwidth-headless-linux-arm64 ./app.go
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build/bin/

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*
          draft: true
          prerelease: false

